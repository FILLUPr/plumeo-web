<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>My Sweet Story - หน้าหลัก</title>
<style>
  :root{ --bg:#FFEFF6; --card:#FFF8F3; --accent:#F4B2C1; --text:#4B2E2E; }
  body{
    margin:0; font-family:'Cordia New',sans-serif; background:var(--bg); color:var(--text); padding:24px;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160"><rect fill="%23FFEFF6" width="160" height="160"/><g transform="translate(10,10)"><g transform="scale(0.9)"><g><path d="M40 55c0-12 20-12 20 0v5H40v-5z" fill="%23F8C6D0" stroke="%23DCA0B0" stroke-width="2"/></g><g transform="translate(0,10)"><rect x="30" y="60" width="40" height="18" rx="8" fill="%23FFD9E6" stroke="%23E6A9B8" stroke-width="2"/></g><g transform="translate(10,0)"><circle cx="24" cy="24" r="6" fill="%23FF7B7B"/></g></g></g></svg>');
    background-repeat:repeat; background-size:160px 160px;
  }
  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  h1{font-size:34px; color:#C97381; margin:6px 0;}
  .top-controls{ display:flex; gap:8px; align-items:center; }
  .btn{
    display:inline-block; padding:10px 18px; border-radius:12px;
    background:linear-gradient(180deg,#F8B1C0,#E88DA0); color:#fff; border:none; font-size:16px; cursor:pointer;
    box-shadow:0 4px 12px rgba(200,120,140,.25);
  }
  main{ max-width:900px; margin:0 auto; }
  .list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .card{ background:var(--card); border-radius:12px; padding:14px; box-shadow:0 6px 18px rgba(100,40,60,.08); }
  .card h3{ margin:0 0 6px 0; font-size:18px; color:#6b3740; }
  .meta{ font-size:12px; color:#8a5b5e; margin-bottom:10px; }
  .card .card-actions{ text-align:right; }
  .small-btn{ background:#F4B2C1; border:none; color:#fff; padding:6px 10px; border-radius:8px; cursor:pointer; font-size:13px; margin-left:6px; }
  .empty{ text-align:center; padding:36px; color:#8a5b5e; font-size:16px;}
  footer{ text-align:center; margin-top:22px; color:#7a4e53; font-size:13px; }

  /* Auth Modal */
  .auth-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9999}
  .auth-modal{width:min(420px,92vw);background:#FFF;border-radius:14px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);font-family:'Cordia New',sans-serif}
  .auth-modal h3{margin:0 0 8px 0;color:#C97381;font-size:22px}
  .auth-modal input{width:100%;padding:10px;border-radius:8px;border:2px solid #F4C2C2;margin:6px 0;font-size:14pt}
  .auth-row{display:flex;gap:8px;align-items:center;justify-content:space-between}
  .btn.primary{padding:8px 12px;border:none;border-radius:10px;background:linear-gradient(180deg,#F1A9B6,#D97288);color:#fff;cursor:pointer}
  .btn.ghost{padding:8px 12px;border-radius:10px;border:2px solid #F4B2C1;background:#fff;color:#8b4b51;cursor:pointer}
  .auth-note{font-size:13px;color:#8a5b5e;margin-top:6px}
  .link{color:#C97381; cursor:pointer; text-decoration:underline;}
  .sep-center{display:flex;align-items:center;gap:8px;margin:8px 0}
  .sep-center::before,.sep-center::after{content:"";flex:1;height:1px;background:#f0cfd6}
  @media (max-width:520px){ h1{font-size:28px;} .btn{font-size:14px;padding:8px 14px;} }
</style>
</head>
<body>
<header>
  <div class="top-controls"><h1>🧁 My Sweet Story</h1></div>
  <div class="top-controls">
    <!-- เริ่มต้น: ซ่อนปุ่มพล็อต/เขียนเรื่องไว้ก่อน -->
    <button class="btn" id="newPlotBtn" style="display:none">🍰 วางพล็อตใหม่</button>
    <button class="btn" id="plotBtn" style="display:none">📚 คลังพล็อต</button>
    <button class="btn" id="newBtn"  style="display:none">✏️ เขียนเรื่องใหม่</button>
    <button class="btn" id="loginBtn">🔑 เข้าสู่ระบบ</button>
    <button class="btn" id="logoutBtn" style="display:none">🚪 ออกจากระบบ</button>

  </div>
</header>

<main>
  <section id="storiesSection">
    <div id="storiesList" class="list"></div>
    <div id="emptyMsg" class="empty" style="display:none">ยังไม่มีนิยายที่บันทึกไว้ 💕</div>
  </section>
  <footer>© 2025 My Sweet Story — Sweet Ideas Bloom Here ✨</footer>
</main>

<!-- Auth Modal -->
<div class="auth-modal-backdrop" id="authBackdrop">
  <div class="auth-modal">
    <h3>เข้าสู่ระบบ</h3>
    <input id="authEmail" type="email" placeholder="อีเมล" />
    <input id="authPassword" type="password" placeholder="รหัสผ่าน" />
    <div class="auth-row">
      <button class="btn primary" id="emailSignInBtn">เข้าสู่ระบบ</button>
      <button class="btn ghost" id="emailSignUpBtn">สมัครสมาชิก</button>
    </div>
    <div class="sep-center"><span>หรือ</span></div>
    <button class="btn primary" id="googleBtn" style="width:100%">เข้าสู่ระบบด้วย Google</button>
    <div class="auth-note">
      ลืมรหัสผ่าน? <span class="link" id="resetLink">กดที่นี่</span><br/>
      ยังไม่ยืนยันอีเมล? <span class="link" id="verifyLink">ส่งลิงก์ยืนยันอีกครั้ง</span>
    </div>
    <div class="auth-row" style="margin-top:8px">
      <span id="roleBadge"></span>
      <button class="btn ghost" id="closeAuth">ปิด</button>
    </div>
  </div>
</div>

<!-- Firebase + Auth/DB layer -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut,
    onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    sendEmailVerification, sendPasswordResetEmail, setPersistence, browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import {
    getFirestore, doc, getDocs, setDoc, collection,
    query, orderBy, deleteDoc, getDoc, collectionGroup
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  // ===== Firebase config (ใช้ตัวเดียวกับทุกหน้า) =====
  const firebaseConfig = {
    apiKey: "AIzaSyBpVTKy5Wi6IZ3VEhp6fUwLoJ3KYtuYxgs",
    authDomain: "plumeo-475aa.firebaseapp.com",
    projectId: "plumeo-475aa",
    storageBucket: "plumeo-475aa.firebasestorage.app",
    messagingSenderId: "452998025243",
    appId: "1:452998025243:web:27d16edb8360cda2cc711e",
    measurementId: "G-ZFXVG7W436"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const loginBtn   = document.getElementById('loginBtn');
  const logoutBtn  = document.getElementById('logoutBtn');
  const plotBtn    = document.getElementById('plotBtn');
  const newPlotBtn = document.getElementById('newPlotBtn'); // ปุ่มวางพล็อตใหม่
  const newBtn     = document.getElementById('newBtn');      // เขียนนิยาย


  const backdrop   = document.getElementById("authBackdrop");
  const emailInput = document.getElementById("authEmail");
  const passInput  = document.getElementById("authPassword");
  const emailSignInBtn = document.getElementById("emailSignInBtn");
  const emailSignUpBtn = document.getElementById("emailSignUpBtn");
  const googleBtn      = document.getElementById("googleBtn");
  const resetLink      = document.getElementById("resetLink");
  const verifyLink     = document.getElementById("verifyLink");
  const closeAuth      = document.getElementById("closeAuth");

  const showAuth = () => { backdrop.style.display = "flex"; };
  const hideAuth = () => { backdrop.style.display = "none"; };

  async function loadStoriesCloud() {
    const user = auth.currentUser;
    if (!user) return [];

    const token = await user.getIdTokenResult(true);
    const role  = token?.claims?.role || "member";
    window.__currentRole = role;

    const mapSnap = (snap) => {
      const arr = [];
      snap.forEach(d => {
        arr.push({ id: d.id, ...d.data() });   // << ใช้ doc.id เป็น id เสมอ
      });
      return arr;
    };

    if (role === "admin") {
      const q = query(collectionGroup(db, "stories"), orderBy("updatedAt", "desc"));
      const snap = await getDocs(q);
      return mapSnap(snap);
    } else {
      const q = query(collection(db, `users/${user.uid}/stories`), orderBy("updatedAt", "desc"));
      const snap = await getDocs(q);
      return mapSnap(snap);
    }
  }

  async function deleteStoryCloud(id) {
    const user = auth.currentUser;
    if (!user) return;
    if (window.__currentRole === "admin") {
      alert("ลบข้ามผู้ใช้ยังไม่ได้ทำ ให้เพิ่ม ownerId เองทีหลังนะครับ");
      return;
    }
    await deleteDoc(doc(db, `users/${user.uid}/stories/${id}`));
  }

  window.MyCloud = {
    async loadStories()  { return auth.currentUser ? await loadStoriesCloud() : []; },
    async deleteStory(id){ return auth.currentUser ? await deleteStoryCloud(id) : null; }
  };

  async function renderList() {
    const container = document.getElementById("storiesList");
    const emptyMsg  = document.getElementById("emptyMsg");
    container.innerHTML = "";

    const rawList = await window.MyCloud.loadStories();

    // ---- กันเรื่องซ้ำ: ใช้ id เป็นตัวตัดสิน ----
    const seen = new Set();
    const list = [];
    for (const item of rawList) {
      if (!item.id) continue;
      if (seen.has(item.id)) continue;
      seen.add(item.id);
      list.push(item);
    }

    if (!list.length) {
      emptyMsg.style.display = "block";
      return;
    }
    emptyMsg.style.display = "none";

    if (window.__currentRole === "admin") {
      const badge = document.getElementById("roleBadge");
      if (badge) badge.textContent = "⭐ Admin Mode";
    }

    list.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("h3");
      title.textContent = item.title || "Untitled";

      const meta = document.createElement("div");
      meta.className = "meta";
      const date = new Date(item.updatedAt || Date.now());
      meta.textContent = "บันทึกล่าสุด: " +
        date.toLocaleDateString("th-TH", { year: "numeric", month: "short", day: "numeric" });

      const excerpt = document.createElement("div");
      excerpt.textContent = item.blurb || "";

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const openBtn = document.createElement("button");
      openBtn.className = "small-btn";
      openBtn.textContent = "เปิดต่อ";
      openBtn.onclick = () => {
        location.href = "write.html?id=" + encodeURIComponent(item.id) +
          (item.ownerId ? `&owner=${encodeURIComponent(item.ownerId)}` : "");
      };

      const delBtn = document.createElement("button");
      delBtn.className = "small-btn";
      delBtn.style.background = "#e68b9a";
      delBtn.textContent = "ลบ";
      delBtn.onclick = async () => {
        if (confirm(`ลบเรื่อง "${item.title || "Untitled"}"?`)) {
          await window.MyCloud.deleteStory(item.id);
          await renderList();
        }
      };

      actions.append(openBtn, delBtn);
      card.append(title, meta, excerpt, actions);
      container.appendChild(card);
    });
  }

  async function init() {
    await setPersistence(auth, browserLocalPersistence);

    // ปุ่ม modal
    loginBtn.addEventListener("click", showAuth);
    closeAuth.addEventListener("click", hideAuth);

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      location.reload();
    });

    googleBtn.addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
        hideAuth();
      } catch (err) {
        alert(err.message || "ไม่สามารถเข้าสู่ระบบด้วย Google ได้");
      }
    });

    emailSignInBtn.addEventListener("click", async () => {
      const e = (emailInput.value || "").trim();
      const p = passInput.value || "";
      if (!e || !p) return alert("กรอกอีเมลและรหัสผ่าน");
      try {
        await signInWithEmailAndPassword(auth, e, p);
        hideAuth();
      } catch (err) {
        alert(err.message || "เข้าสู่ระบบไม่สำเร็จ");
      }
    });

    emailSignUpBtn.addEventListener("click", async () => {
      const e = (emailInput.value || "").trim();
      const p = passInput.value || "";
      if (!e || !p) return alert("กรอกอีเมลและรหัสผ่าน");
      try {
        const cred = await createUserWithEmailAndPassword(auth, e, p);
        await setDoc(doc(db, `users/${cred.user.uid}`), {
          uid: cred.user.uid,
          email: e,
          role: "member",
          createdAt: Date.now()
        }, { merge: true });
        try { await sendEmailVerification(cred.user); } catch {}
        hideAuth();
      } catch (err) {
        alert(err.message || "สมัครสมาชิกไม่สำเร็จ");
      }
    });

    resetLink.addEventListener("click", async () => {
      const e = (emailInput.value || "").trim();
      if (!e) return alert("ใส่อีเมลก่อน");
      try {
        await sendPasswordResetEmail(auth, e);
        alert("ส่งอีเมลตั้งรหัสผ่านใหม่แล้ว");
      } catch (err) {
        alert(err.message || "ส่งอีเมลไม่สำเร็จ");
      }
    });

    verifyLink.addEventListener("click", async () => {
      if (!auth.currentUser) return alert("ต้องเข้าสู่ระบบก่อน");
      try {
        await sendEmailVerification(auth.currentUser);
        alert("ส่งลิงก์ยืนยันแล้ว");
      } catch (err) {
        alert(err.message || "ส่งลิงก์ไม่สำเร็จ");
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        loginBtn.style.display  = "none";
        logoutBtn.style.display = "inline-block";
        plotBtn.style.display   = "inline-block";
        newBtn.style.display    = "inline-block";

        const profRef  = doc(db, `users/${user.uid}`);
        const profSnap = await getDoc(profRef);
        if (!profSnap.exists()) {
          await setDoc(profRef, {
            uid: user.uid,
            email: user.email || "",
            role: "member",
            createdAt: Date.now()
          }, { merge: true });
        }
      } else {
        loginBtn.style.display  = "inline-block";
        logoutBtn.style.display = "none";
        plotBtn.style.display   = "none";
        newBtn.style.display    = "none";
      }

      await renderList();
    });

    // ปุ่มไปหน้าอื่น
    plotBtn.addEventListener("click", () => location.href = "plot_library.html");
    newBtn.addEventListener("click",  () => location.href = "write.html");
  }

  init();
</script>




</body>
</html>
