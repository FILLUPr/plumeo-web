<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>คลังพล็อตของฉัน | My Sweet Story</title>
  <style>
    body {
      font-family: "Cordia New", sans-serif;
      background-color: #fffaf3;
      background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP4+fPnfwAI+AN6I2HHzgAAAABJRU5ErkJggg==');
      background-repeat: repeat;
      margin: 0;
      padding: 0;
      color: #5a4632;
    }
    header {
      background-color: #f9e0c3;
      padding: 16px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }
    header .title {
      font-size: 2rem;
      font-weight: bold;
      color: #8b5e3c;
    }
    header .auth-area{
      font-size:14px;
      display:flex;
      align-items:center;
      gap:8px;
      color:#8b5e3c;
    }
    header .auth-area button{
      padding:6px 10px;
      border:none;
      border-radius:10px;
      background:#f4b8b8;
      color:#fff;
      cursor:pointer;
      font-size:14px;
    }

    main {
      max-width: 850px;
      margin: 30px auto;
      background-color: #fff7ee;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h2 {
      color: #a67856;
      border-bottom: 2px dashed #e0c4a8;
      padding-bottom: 5px;
      font-size: 1.4rem;
    }
    .plot-item {
      background-color: #fff;
      border: 1px solid #e4d3c1;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .plot-info {
      flex: 1;
      margin-right: 15px;
    }
    button {
      background-color: #f4b8b8;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      margin-left: 6px;
      transition: 0.2s;
    }
    button:hover {
      background-color: #f19c9c;
    }
    .empty {
      text-align: center;
      color: #a67856;
      padding: 40px 0;
      font-size: 1.2rem;
    }
    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #8c7760;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">📚 คลังพล็อตของฉัน</div>
    <div class="auth-area">
      <span id="userEmail"></span>
      <button id="loginBtn">🔑 ไปหน้าล็อกอิน</button>
      <button id="logoutBtn" style="display:none">🚪 ออกจากระบบ</button>
    </div>
  </header>

  <main>
    <h2>พล็อตทั้งหมดของฉัน 🍪</h2>
    <div id="plotList" class="plot-list"></div>

    <div style="text-align:center; margin-top:20px;">
      <button id="newPlotBtn">🍰 สร้างพล็อตใหม่</button>
      <button onclick="window.location.href='index.html'">🏠 กลับหน้าหลัก</button>
    </div>
  </main>

  <footer>© 2025 My Sweet Story — Sweet Ideas Bloom Here ✨</footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, signOut,
      setPersistence, browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import {
      getFirestore, collection, query, orderBy, getDocs, deleteDoc, doc, getDoc, setDoc
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBpVTKy5Wi6IZ3VEhp6fUwLoJ3KYtuYxgs",
      authDomain: "plumeo-475aa.firebaseapp.com",
      projectId: "plumeo-475aa",
      storageBucket: "plumeo-475aa.firebasestorage.app",
      messagingSenderId: "452998025243",
      appId: "1:452998025243:web:27d16edb8360cda2cc711e",
      measurementId: "G-ZFXVG7W436"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);
    await setPersistence(auth, browserLocalPersistence);

    const loginBtn    = document.getElementById('loginBtn');
    const logoutBtn   = document.getElementById('logoutBtn');
    const userEmailEl = document.getElementById('userEmail');
    const plotList    = document.getElementById('plotList');
    const newPlotBtn  = document.getElementById('newPlotBtn');

    loginBtn.addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
      location.reload();
    });

    newPlotBtn.addEventListener('click', () => {
      window.location.href = 'plot.html';
    });

    async function loadPlots(user) {
      plotList.innerHTML = '';

      const q = query(
        collection(db, `users/${user.uid}/plots`),
        orderBy('updatedAt', 'desc')
      );
      const snap = await getDocs(q);

      if (snap.empty) {
        plotList.innerHTML = '<div class="empty">ยังไม่มีพล็อตที่บันทึกไว้ 🍪</div>';
        return;
      }

      snap.forEach(d => {
        const p = d.data();
        const div = document.createElement('div');
        div.className = 'plot-item';

        const info = document.createElement('div');
        info.className = 'plot-info';
        const dateStr = p.updatedAt
          ? new Date(p.updatedAt).toLocaleString('th-TH')
          : 'ไม่ระบุ';

        info.innerHTML = `
          <strong>📖 ${p.title || "(ไม่มีชื่อเรื่อง)"}</strong><br>
          <small>แก้ไขล่าสุด: ${dateStr}</small>
        `;

        const btnWrap = document.createElement('div');

        const openBtn = document.createElement('button');
        openBtn.textContent = 'เปิดพล็อต';
        openBtn.onclick = () => {
          window.location.href = 'plot.html?id=' + encodeURIComponent(d.id);
        };

        const delBtn = document.createElement('button');
        delBtn.textContent = 'ลบ';
        delBtn.onclick = async () => {
          if (confirm('ลบพล็อตนี้แน่ใจไหม?')) {
            await deleteDoc(doc(db, `users/${user.uid}/plots/${d.id}`));
            await loadPlots(user);
          }
        };

        btnWrap.appendChild(openBtn);
        btnWrap.appendChild(delBtn);

        div.appendChild(info);
        div.appendChild(btnWrap);
        plotList.appendChild(div);
      });
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        userEmailEl.textContent = user.email || '';
        loginBtn.style.display  = 'none';
        logoutBtn.style.display = 'inline-block';

        // ensure profile (ให้ตรงกับหน้าที่เหลือ)
        const profRef  = doc(db, `users/${user.uid}`);
        const profSnap = await getDoc(profRef);
        if (!profSnap.exists()) {
          await setDoc(profRef, {
            uid: user.uid,
            email: user.email || '',
            role: 'member',
            createdAt: Date.now()
          }, { merge:true });
        }

        await loadPlots(user);
      } else {
        userEmailEl.textContent = '';
        loginBtn.style.display  = 'inline-block';
        logoutBtn.style.display = 'none';
        plotList.innerHTML = '<div class="empty">ต้องเข้าสู่ระบบก่อนนะคะ 🍪</div>';
      }
    });
  </script>
</body>
</html>
