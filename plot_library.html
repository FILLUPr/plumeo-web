<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>คลังพล็อตของฉัน | My Sweet Story</title>
  <style>
    body {
      font-family: "Cordia New", sans-serif;
      background-color: #fffaf3;
      background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP4+fPnfwAI+AN6I2HHzgAAAABJRU5ErkJggg==');
      background-repeat: repeat;
      margin: 0;
      padding: 0;
      color: #5a4632;
    }
    header {
      background-color: #f9e0c3;
      padding: 16px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }
    header .title {
      font-size: 2rem;
      font-weight: bold;
      color: #8b5e3c;
    }
    header .auth-area{
      font-size:14px;
      display:flex;
      align-items:center;
      gap:8px;
      color:#8b5e3c;
    }
    header .auth-area button{
      padding:6px 10px;
      border:none;
      border-radius:10px;
      background:#f4b8b8;
      color:#fff;
      cursor:pointer;
      font-size:14px;
    }

    main {
      max-width: 850px;
      margin: 30px auto;
      background-color: #fff7ee;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h2 {
      color: #a67856;
      border-bottom: 2px dashed #e0c4a8;
      padding-bottom: 5px;
      font-size: 1.4rem;
    }
    .plot-item {
      background-color: #fff;
      border: 1px solid #e4d3c1;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .plot-info {
      flex: 1;
      margin-right: 15px;
    }
    .plot-info small{
      color:#998167;
    }
    button {
      background-color: #f4b8b8;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      margin-left: 6px;
      transition: 0.2s;
    }
    button:hover {
      background-color: #f19c9c;
    }
    .empty {
      text-align: center;
      color: #a67856;
      padding: 40px 0;
      font-size: 1.2rem;
    }
    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #8c7760;
    }

    /* Auth Modal (เหมือนหน้า write) */
    .auth-modal-backdrop{
      position:fixed;inset:0;
      background:rgba(0,0,0,.35);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
    }
    .auth-modal{
      width:min(420px,92vw);
      background:#FFF;
      border-radius:14px;
      padding:16px;
      box-shadow:0 20px 60px rgba(0,0,0,.25);
      font-family:'Cordia New',sans-serif;
    }
    .auth-modal h3{margin:0 0 8px 0;color:#C97381;font-size:22px}
    .auth-modal input{
      width:100%;padding:10px;border-radius:8px;
      border:2px solid #F4C2C2;margin:6px 0;font-size:14pt
    }
    .auth-row{display:flex;gap:8px;align-items:center;justify-content:space-between}
    .btn.primary{padding:8px 12px;border:none;border-radius:10px;
      background:linear-gradient(180deg,#F1A9B6,#D97288);color:#fff;cursor:pointer}
    .btn.ghost{padding:8px 12px;border-radius:10px;border:2px solid #F4B2C1;
      background:#fff;color:#8b4b51;cursor:pointer}
    .auth-note{font-size:13px;color:#8a5b5e;margin-top:6px}
    .link{color:#C97381; cursor:pointer; text-decoration:underline;}
    .sep-center{display:flex;align-items:center;gap:8px;margin:8px 0}
    .sep-center::before,.sep-center::after{content:"";flex:1;height:1px;background:#f0cfd6}
  </style>
</head>
<body>
  <header>
    <div class="title">📚 คลังพล็อตของฉัน</div>
    <div class="auth-area">
      <span id="userEmail"></span>
      <button id="loginBtn">🔑 เข้าสู่ระบบ</button>
      <button id="logoutBtn" style="display:none">🚪 ออกจากระบบ</button>
    </div>
  </header>

  <main>
    <h2>พล็อตทั้งหมดของฉัน 🍪</h2>
    <div id="plotList" class="plot-list"></div>

    <div style="text-align:center; margin-top:20px;">
      <button id="newPlotBtn">🍰 สร้างพล็อตใหม่</button>
      <button onclick="window.location.href='index.html'">🏠 กลับหน้าหลัก</button>
    </div>
  </main>

  <footer>© 2025 My Sweet Story — Sweet Ideas Bloom Here ✨</footer>

  <!-- Auth Modal (Email + Google) -->
  <div class="auth-modal-backdrop" id="authBackdrop">
    <div class="auth-modal">
      <h3>เข้าสู่ระบบ</h3>
      <input id="authEmail" type="email" placeholder="อีเมล" />
      <input id="authPassword" type="password" placeholder="รหัสผ่าน" />
      <div class="auth-row">
        <button class="btn primary" id="emailSignInBtn">เข้าสู่ระบบ</button>
        <button class="btn ghost" id="emailSignUpBtn">สมัครสมาชิก</button>
      </div>
      <div class="sep-center"><span>หรือ</span></div>
      <button class="btn primary" id="googleBtn" style="width:100%">เข้าสู่ระบบด้วย Google</button>
      <div class="auth-note">
        ลืมรหัสผ่าน? <span class="link" id="resetLink">กดที่นี่</span><br/>
        ยังไม่ยืนยันอีเมล? <span class="link" id="verifyLink">ส่งลิงก์ยืนยันอีกครั้ง</span>
      </div>
      <div class="auth-row" style="margin-top:8px">
        <span></span>
        <button class="btn ghost" id="closeAuth">ปิด</button>
      </div>
    </div>
  </div>

  <!-- Firebase + Firestore (แบบเดียวกับ index/write) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut,
      onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
      sendEmailVerification, sendPasswordResetEmail, setPersistence, browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import {
      getFirestore, collection, query, orderBy,
      getDocs, doc, deleteDoc, setDoc, getDoc
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // === CONFIG เดียวกับ index/write ===
    const firebaseConfig = {
      apiKey: "AIzaSyBpVTKy5Wi6IZ3VEhp6fUwLoJ3KYtuYxgs",
      authDomain: "plumeo-475aa.firebaseapp.com",
      projectId: "plumeo-475aa",
      storageBucket: "plumeo-475aa.firebasestorage.app",
      messagingSenderId: "452998025243",
      appId: "1:452998025243:web:27d16edb8360cda2cc711e",
      measurementId: "G-ZFXVG7W436"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);
    const provider = new GoogleAuthProvider();
    await setPersistence(auth, browserLocalPersistence);

    // ====== DOM ======
    const plotList     = document.getElementById("plotList");
    const userEmailEl  = document.getElementById("userEmail");
    const loginBtn     = document.getElementById("loginBtn");
    const logoutBtn    = document.getElementById("logoutBtn");
    const newPlotBtn   = document.getElementById("newPlotBtn");

    // modal
    const backdrop   = document.getElementById('authBackdrop');
    const emailInput = document.getElementById('authEmail');
    const passInput  = document.getElementById('authPassword');
    const emailSignInBtn = document.getElementById('emailSignInBtn');
    const emailSignUpBtn = document.getElementById('emailSignUpBtn');
    const googleBtn      = document.getElementById('googleBtn');
    const resetLink      = document.getElementById('resetLink');
    const verifyLink     = document.getElementById('verifyLink');
    const closeAuth      = document.getElementById('closeAuth');

    const showAuth = () => { backdrop.style.display='flex'; };
    const hideAuth = () => { backdrop.style.display='none'; };

    loginBtn.addEventListener('click', showAuth);
    closeAuth.addEventListener('click', hideAuth);

    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
      plotList.innerHTML = '';
      plotList.innerHTML = '<div class="empty">กรุณาเข้าสู่ระบบก่อนดูพล็อต 🍪</div>';
    });

    googleBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
        hideAuth();
      } catch (err) {
        alert(err.message || 'ไม่สามารถเข้าสู่ระบบด้วย Google ได้');
      }
    });

    emailSignInBtn.addEventListener('click', async () => {
      const e = (emailInput.value || '').trim();
      const p = passInput.value || '';
      if (!e || !p) return alert('กรอกอีเมลและรหัสผ่าน');
      try {
        await signInWithEmailAndPassword(auth, e, p);
        hideAuth();
      } catch (err) {
        alert(err.message || 'เข้าสู่ระบบไม่สำเร็จ');
      }
    });

    emailSignUpBtn.addEventListener('click', async () => {
      const e = (emailInput.value || '').trim();
      const p = passInput.value || '';
      if (!e || !p) return alert('กรอกอีเมลและรหัสผ่าน');
      try {
        const cred = await createUserWithEmailAndPassword(auth, e, p);
        // สร้างเอกสารโปรไฟล์เบื้องต้น
        await setDoc(doc(db, `users/${cred.user.uid}`), {
          uid: cred.user.uid,
          email: e,
          role: 'member',
          createdAt: Date.now()
        }, { merge: true });
        try { await sendEmailVerification(cred.user); } catch {}
        hideAuth();
      } catch (err) {
        alert(err.message || 'สมัครสมาชิกไม่สำเร็จ');
      }
    });

    resetLink.addEventListener('click', async () => {
      const e = (emailInput.value || '').trim();
      if (!e) return alert('ใส่อีเมลก่อน');
      try {
        await sendPasswordResetEmail(auth, e);
        alert('ส่งอีเมลตั้งรหัสผ่านใหม่แล้ว');
      } catch (err) {
        alert(err.message || 'ส่งอีเมลไม่สำเร็จ');
      }
    });

    verifyLink.addEventListener('click', async () => {
      if (!auth.currentUser) return alert('ต้องเข้าสู่ระบบก่อน');
      try {
        await sendEmailVerification(auth.currentUser);
        alert('ส่งลิงก์ยืนยันแล้ว');
      } catch (err) {
        alert(err.message || 'ส่งลิงก์ยืนยันไม่สำเร็จ');
      }
    });

    // ====== โหลดพล็อตจาก Firestore ======
    async function loadPlots() {
      const user = auth.currentUser;
      if (!user) {
        plotList.innerHTML = '<div class="empty">กรุณาเข้าสู่ระบบก่อนดูพล็อต 🍪</div>';
        return;
      }

      plotList.innerHTML = 'กำลังโหลดพล็อต...';

      try {
        const qRef = query(
          collection(db, `users/${user.uid}/plots`),
          orderBy('updatedAt', 'desc')
        );
        const snap = await getDocs(qRef);

        if (snap.empty) {
          plotList.innerHTML = '<div class="empty">ยังไม่มีพล็อตที่บันทึกไว้ 🍪</div>';
          return;
        }

        plotList.innerHTML = '';

        snap.forEach(d => {
          const data = d.data();
          const id   = d.id;
          const title = (data.title || '(ไม่มีชื่อเรื่อง)').trim();
          const dateStr = data.updatedAt
            ? new Date(data.updatedAt).toLocaleString('th-TH')
            : 'ไม่ระบุ';

          const div = document.createElement('div');
          div.className = 'plot-item';
          div.innerHTML = `
            <div class="plot-info">
              <strong>📖 ${title}</strong><br>
              <small>บันทึกล่าสุด: ${dateStr}</small>
            </div>
            <div>
              <button data-open="${id}">เปิดพล็อต</button>
              <button data-del="${id}">ลบ</button>
            </div>
          `;
          plotList.appendChild(div);
        });

      } catch (err) {
        console.error(err);
        plotList.innerHTML = '<div class="empty">โหลดพล็อตไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้งค่ะ</div>';
      }
    }

    // เปิด / ลบพล็อต
    plotList.addEventListener('click', async (e) => {
      const openId = e.target.getAttribute('data-open');
      const delId  = e.target.getAttribute('data-del');

      if (openId) {
        // ไปหน้า plot.html?id=...
        location.href = 'plot.html?id=' + encodeURIComponent(openId);
        return;
      }
      if (delId) {
        if (!confirm('ลบพล็อตนี้แน่ใจไหม?')) return;
        try {
          await deleteDoc(doc(db, `users/${auth.currentUser.uid}/plots/${delId}`));
          await loadPlots();
        } catch (err) {
          alert('ลบพล็อตไม่สำเร็จ');
          console.error(err);
        }
      }
    });

    // ปุ่มสร้างใหม่ → ไป plot.html (ไม่มี id)
    newPlotBtn.addEventListener('click', () => {
      location.href = 'plot.html';
    });

    // ====== ฟัง auth state ======
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        userEmailEl.textContent = user.email || '';
        loginBtn.style.display  = 'none';
        logoutBtn.style.display = 'inline-block';

        // สร้าง profile doc ถ้ายังไม่มี
        const profRef  = doc(db, `users/${user.uid}`);
        const profSnap = await getDoc(profRef);
        if (!profSnap.exists()) {
          await setDoc(profRef, {
            uid: user.uid,
            email: user.email || '',
            role: 'member',
            createdAt: Date.now()
          }, { merge: true });
        }

        await loadPlots();
      } else {
        userEmailEl.textContent = '';
        loginBtn.style.display  = 'inline-block';
        logoutBtn.style.display = 'none';
        plotList.innerHTML = '<div class="empty">กรุณาเข้าสู่ระบบก่อนดูพล็อต 🍪</div>';
      }
    });

    // เผื่อกรณี auth ยังไม่ firing ทันที
    // ถ้า login อยู่แล้ว จะถูก onAuthStateChanged เรียก loadPlots อีกที
    await loadPlots();
  </script>
</body>
</html>
